<!doctype html><html><head><meta charset="utf-8"><title>Opacity test</title></head>
<body style="font-family:sans-serif">
  <h2>Zone 1 — texte HTML normal</h2>
  <p>Solde du compte : <strong>1 234,56 €</strong></p>
  <button id="pay">Payer</button>

  <h2>Zone 2 — image (photo)</h2>
  <img id="photo" width="300" height="120" alt="">

  <h2>Zone 3 — canvas (rendu "à la jeu vidéo" / Google Docs)</h2>
  <canvas id="game" width="400" height="120"></canvas>
<script>
  // image: gradient + forme, générée pour ne pas dépendre du réseau
  const c1 = document.createElement('canvas'); c1.width=300; c1.height=120;
  const g = c1.getContext('2d'); const grad = g.createLinearGradient(0,0,300,0);
  grad.addColorStop(0,'#e63946'); grad.addColorStop(1,'#457b9d');
  g.fillStyle = grad; g.fillRect(0,0,300,120);
  document.getElementById('photo').src = c1.toDataURL();
  // canvas: du TEXTE et un "ennemi", dessinés en pixels comme le ferait un jeu
  const ctx = document.getElementById('game').getContext('2d');
  ctx.fillStyle = '#111'; ctx.fillRect(0,0,400,120);
  ctx.fillStyle = '#0f0'; ctx.font = '20px monospace';
  ctx.fillText('Score: 4200  Vies: 3', 10, 30);
  ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(300,80,20,0,7); ctx.fill();
</script></body></html>
