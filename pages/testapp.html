<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orders — Acme Console</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
  nav { background: #1e293b; color: #e2e8f0; padding: 16px; }
  nav a { display: block; color: #e2e8f0; text-decoration: none; padding: 8px; border-radius: 6px; }
  nav a.active { background: #334155; }
  main { padding: 24px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .paid { background: #dcfce7; color: #166534; } .pending { background: #fef9c3; color: #854d0e; }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 20px; border-radius: 8px; opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: 1; }
  #feed { border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 20px; max-height: 140px; overflow: hidden; }
  form { margin-top: 20px; display: flex; gap: 8px; }
  input, button, select { padding: 8px 12px; font-size: 14px; }
  button { background: #2563eb; color: white; border: 0; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<nav>
  <h2>Acme</h2>
  <a href="#dashboard">Dashboard</a>
  <a href="#orders" class="active">Orders</a>
  <a href="#customers">Customers</a>
  <a href="#settings">Settings</a>
</nav>
<main>
  <h1>Orders</h1>
  <p>3 open orders — last sync <span id="sync">10:41</span></p>
  <table>
    <thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody id="rows">
      <tr><td>#1042</td><td>Dupont SARL</td><td>€1,240.00</td><td><span class="badge paid">Paid</span></td><td><button data-id="1042" class="ship">Ship</button></td></tr>
      <tr><td>#1043</td><td>Martin & Co</td><td>€380.50</td><td><span class="badge pending">Pending</span></td><td><button data-id="1043" class="ship">Ship</button></td></tr>
      <tr><td>#1044</td><td>Bernard SA</td><td>€2,105.90</td><td><span class="badge pending">Pending</span></td><td><button data-id="1044" class="ship">Ship</button></td></tr>
    </tbody>
  </table>
  <form id="addForm">
    <input id="customer" placeholder="Customer name" aria-label="Customer name">
    <select id="status" aria-label="Status"><option>Paid</option><option>Pending</option></select>
    <button type="submit" id="addBtn">Add order</button>
  </form>
  <div id="feed"><strong>Live activity</strong><div id="feedItems"></div></div>
</main>
<div id="toast" role="status"></div>
<script>
  let next = 1045;
  const toast = (msg) => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1500); };
  document.querySelectorAll('.ship').forEach(b => b.addEventListener('click', () => {
    b.closest('tr').querySelector('.badge').textContent = 'Shipped';
    toast('Order #' + b.dataset.id + ' marked as shipped');
  }));
  document.getElementById('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('customer').value || 'New customer';
    const st = document.getElementById('status').value;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>#${next}</td><td>${name}</td><td>€0.00</td><td><span class="badge ${st.toLowerCase()}">${st}</span></td><td><button class="ship">Ship</button></td>`;
    document.getElementById('rows').appendChild(tr); next++;
    toast('Order added');
  });
  // "living screen": feed updates on its own when started
  const EVENTS = ['#1042 payment confirmed', 'Stock alert: SKU-88 low', 'New signup: claire@ex.fr', '#1044 invoice sent', 'Refund requested #1039'];
  let i = 0; let timer = null;
  window.startFeed = (ms) => { timer = setInterval(() => {
    const d = document.createElement('div'); d.textContent = new Date().toISOString().slice(11,19) + ' — ' + EVENTS[i++ % EVENTS.length];
    const f = document.getElementById('feedItems'); f.prepend(d); while (f.children.length > 4) f.lastChild.remove();
  }, ms); };
  window.stopFeed = () => clearInterval(timer);
</script>
</body>
</html>
