<!doctype html><html><head><meta charset="utf-8"><title>Occlusion</title></head>
<body style="font-family:sans-serif;margin:20px">
  <button id="real" style="position:absolute;left:40px;top:60px;width:120px;height:40px">Real button</button>
  <!-- an overlay that visually COVERS the button but is a different element -->
  <div id="overlay" style="position:absolute;left:20px;top:40px;width:200px;height:90px;background:#3336;color:#fff;display:flex;align-items:center;justify-content:center">Overlay on top</div>
  <p style="margin-top:160px">Also: <span style="opacity:0">INVISIBLE-OPACITY-SECRET</span> and <span style="visibility:hidden">HIDDEN-SECRET</span> and <span style="position:absolute;left:-9999px">OFFSCREEN-SECRET</span> visible-tail.</p>
</body></html>
